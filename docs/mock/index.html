<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reworm — mocks</title>
<style>
:root{
  --ink:#13110f; --ink2:#1b1815; --panel:#231f1b; --panel2:#2b2621; --line:#3a332c;
  --paper:#f5eee4; --muted:#a69a8b; --faint:#6f655a;
  --hanko:#e5482f; --hanko2:#ff6a4d; --gold:#e9b44c; --jade:#3dbb8c; --rose:#e0675d; --sky:#69aee8;
  --r:18px;
  --num: ui-rounded, "SF Pro Rounded", "SF Pro Display", system-ui, sans-serif;
  --txt: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#0b0a09;color:var(--paper);font-family:var(--txt)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* ---------- mock chrome ---------- */
.topbar{position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;justify-content:space-between;
  padding:12px 20px;background:rgba(11,10,9,.85);backdrop-filter:blur(12px);border-bottom:1px solid #221e1a}
.topbar h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
.topbar h1 small{color:var(--muted);font-weight:450;margin-left:8px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:600}
.stage{display:flex;justify-content:center;padding:28px 16px 60px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:36px 28px;padding:28px;max-width:1720px;margin:0 auto}
.board-t{grid-template-columns:repeat(auto-fill,minmax(600px,1fr));border-top:1px solid #221e1a}
.board figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.board figcaption{font-size:13px;color:var(--muted);text-align:center;max-width:370px;line-height:1.45}
.board figcaption b{color:var(--paper);display:block;font-size:14px;margin-bottom:2px}
.notes{max-width:1100px;margin:0 auto;padding:0 28px 60px;color:var(--muted);font-size:14px;line-height:1.6}
.notes h2{color:var(--paper);font-size:16px;margin:28px 0 8px}
.notes code{background:var(--panel);padding:1px 6px;border-radius:6px;color:var(--paper)}

.phone{width:390px;height:844px;border-radius:54px;padding:12px;background:#000;
  box-shadow:0 0 0 1px #2c2824,0 30px 80px rgba(0,0,0,.6);position:relative;flex:none}
.phone::before{content:"";position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:20}
.tablet{width:1180px;height:820px;border-radius:40px;padding:18px;background:#000;box-shadow:0 0 0 1px #2c2824,0 30px 80px rgba(0,0,0,.6);flex:none}
.tablet.portrait{width:820px;height:1180px}
.tablet .app{border-radius:22px}
.tablet .status{height:30px;align-items:center;padding:0 22px;font-size:12px}

.full{width:min(560px,100%);height:calc(100vh - 120px);min-height:700px;border-radius:22px;border:1px solid var(--line);overflow:hidden}
.app{width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--ink);position:relative;display:flex;flex-direction:column}
.full .app{border-radius:0}

/* ---------- app ---------- */
.status{height:50px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 30px 6px;font-size:14px;font-weight:600}
.full .status{display:none}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 18px 18px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.tabs{flex:none;display:flex;justify-content:space-around;padding:8px 10px 26px;border-top:1px solid #241f1b;background:var(--ink)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--faint);padding:4px 16px}
.tabs button.on{color:var(--paper)}
.tabs svg{width:24px;height:24px}

.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.h-title{font-size:30px;font-weight:750;letter-spacing:-.5px;margin:6px 0 2px}
.sub{color:var(--muted);font-size:14px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;margin:22px 2px 10px}
.card{background:var(--panel);border:1px solid #2f2924;border-radius:var(--r);padding:16px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--panel2);font-size:12.5px;color:var(--paper);border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:16px;font-weight:650;font-size:16px;width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--hanko);color:#fff;box-shadow:0 8px 24px rgba(229,72,47,.35)}
.btn.primary:active{transform:scale(.98)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line)}
.btn.small{height:40px;font-size:14px;border-radius:12px;width:auto;padding:0 14px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.icon-btn svg{width:20px;height:20px}

/* seal / logo */
.seal{width:34px;height:34px;border-radius:9px;background:var(--hanko);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);transform:rotate(-4deg);font-family:var(--num)}
.brand{font-weight:750;font-size:18px;letter-spacing:-.2px}
.brand span{color:var(--hanko2)}

/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#2e211a 0%,#231b16 55%,#1d1714 100%);border:1px solid #3d2c22}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;
  background:repeating-radial-gradient(circle,#0000 0 5px,rgba(255,255,255,.035) 5px 6px),radial-gradient(circle,#e5482f 0 18%,#14110f 19% 100%);opacity:.9}
.hero > *{position:relative;z-index:1}
.kata{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);font-weight:700}

/* bucket bar (quizlet-style) */
.buckets{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--panel2);gap:2px}
.buckets i{display:block;height:100%}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:9px}
.legend b{color:var(--paper);font-weight:650}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}

/* decades */
.decades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dec{border-radius:14px;padding:10px 10px 9px;border:1px solid #ffffff10;text-align:left}
.dec .d{font-size:17px;font-weight:750;font-family:var(--num)}
.dec .p{font-size:12px;opacity:.8;margin-top:1px}
.dec .bar{height:4px;border-radius:9px;background:#00000040;margin-top:7px;overflow:hidden}
.dec .bar i{display:block;height:100%;background:currentColor;opacity:.85}

/* deck list */
.deck{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px}
.deck + .deck{margin-top:4px}
.deck:hover{background:var(--panel)}
.art{width:52px;height:52px;border-radius:12px;flex:none;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;position:relative;overflow:hidden}
.art.lg{width:100%;height:auto;aspect-ratio:1;border-radius:22px;font-size:46px}
.art .art-bg{position:absolute;right:-18px;bottom:-18px;opacity:.18;transform:rotate(-14deg)}
.art .art-fg{position:relative;z-index:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.25),transparent 60%)}
.deck .meta{flex:1;min-width:0}
.deck .t{font-weight:620;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deck .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.mini-ring{width:34px;height:34px;flex:none}

/* belt */
.belt{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.belt svg{width:34px;height:18px}

/* setup */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:14px;color:var(--paper)}
.chip.on{background:var(--paper);color:var(--ink);border-color:var(--paper);font-weight:620}
.chip small{color:var(--muted);margin-left:4px}
.chip.on small{color:#00000080}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--panel);border:1.5px solid transparent;text-align:left;width:100%}
.opt + .opt{margin-top:8px}
.opt.on{border-color:var(--hanko);background:#2b1f1a}
.opt .ic{width:38px;height:38px;border-radius:11px;background:var(--panel2);display:grid;place-items:center;flex:none;font-size:18px}
.opt .ic svg{width:22px;height:22px}
.opt .t{font-weight:640;font-size:15px}
.opt .s{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.opt .tag{font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gold);margin-left:6px}
.segbar{display:flex;background:var(--panel);border-radius:13px;padding:3px;border:1px solid var(--line)}
.segbar button{flex:1;padding:9px 4px;border-radius:10px;font-size:14px;color:var(--muted)}
.segbar button.on{background:var(--panel2);color:var(--paper);font-weight:620;box-shadow:0 1px 0 #ffffff10 inset,0 2px 8px #0006}
.distrib{display:flex;height:26px;border-radius:9px;overflow:hidden;margin-top:10px;font-size:11.5px;font-weight:650}
.distrib i{display:flex;align-items:center;justify-content:center;font-style:normal;color:#14110f}
.range{position:relative;height:44px;margin-top:4px}
.range .track{position:absolute;left:0;right:0;top:20px;height:4px;border-radius:9px;background:var(--panel2)}
.range .fill{position:absolute;top:20px;height:4px;background:var(--hanko);border-radius:9px}
.range .knob{position:absolute;top:11px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 2px 8px #000a;transform:translateX(-50%)}
.range .ticks{position:absolute;left:0;right:0;top:32px;display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.sticky-cta{flex:none;padding:12px 18px 28px;background:linear-gradient(transparent,var(--ink) 30%)}
.full .sticky-cta{padding-bottom:18px}

/* play */
.playhead{display:flex;align-items:center;gap:12px;padding:2px 0 8px}
.prog{flex:1;display:flex;gap:3px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--panel2)}
.prog i.ok{background:var(--jade)} .prog i.bad{background:var(--rose)} .prog i.cur{background:var(--paper)}
.counts{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.counts b{color:var(--paper)}
.vinyl-wrap{display:flex;justify-content:center;margin:10px 0 4px}
.vinyl{width:178px;height:178px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,#191614 0 2px,#221e1b 2px 3px),#191614;
  box-shadow:0 20px 50px #000a, inset 0 0 0 1px #ffffff12}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 10%,rgba(255,255,255,.07) 14%,transparent 20% 60%,rgba(255,255,255,.05) 64%,transparent 70%)}
.vinyl .lbl{position:absolute;inset:33%;border-radius:50%;background:var(--hanko);display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff;font-family:var(--num);box-shadow:inset 0 0 0 3px #0002}
.vinyl .lbl::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.vinyl .lbl span{transform:translateY(-14px);font-size:20px;opacity:.9}
.spin{animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{display:flex;align-items:center;gap:3px;height:34px;margin:14px 4px 4px}
.wave i{flex:1;border-radius:3px;background:var(--line);transition:background .2s}
.wave i.on{background:var(--paper)}
.playing .wave i.on:nth-last-child(n){animation:none}
.time{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 4px}
.volrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--faint)}
.vb{display:inline-block;width:46px;height:4px;border-radius:9px;background:var(--panel2);overflow:hidden}
.vb i{display:block;height:100%;background:var(--jade);transition:width .1s linear}
.player-ctl{display:flex;justify-content:center;gap:14px;margin-top:8px}
.player-ctl button{height:38px;padding:0 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;display:flex;align-items:center;gap:6px;color:var(--paper)}
.player-ctl svg{width:16px;height:16px}

.yearcard{margin:18px 0 0;border-radius:24px;padding:16px 16px 18px;text-align:center;position:relative;touch-action:none;user-select:none;
  background:linear-gradient(180deg,#f7f0e6,#ece2d4);color:var(--ink);box-shadow:0 16px 40px #000a;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .2s}
.yearcard.drag{transition:none}
.yearcard .q{font-size:13px;font-weight:650;letter-spacing:.4px;color:#7b6e60}
.yearcard .y{font-size:84px;line-height:1;font-weight:800;letter-spacing:-3px;font-family:var(--num);margin:4px 0 2px}
.yearcard .hint{font-size:12px;color:#8e8072}
.yearcard .tint{position:absolute;inset:0;border-radius:24px;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:12px;font-weight:800;font-size:13px;letter-spacing:2px;opacity:0;color:#fff;z-index:2}
.yearcard .tint span{background:rgba(0,0,0,.35);padding:4px 10px;border-radius:99px}
.yearcard .y{position:relative;z-index:3}
.choices{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;margin-top:16px}
.choice{height:74px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:15px;
  background:var(--panel);border:1px solid var(--line);transition:transform .1s}
.choice:active{transform:scale(.96)}
.choice svg{width:22px;height:22px}
.choice small{font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.5px}
.choice.mid{background:var(--hanko);border-color:var(--hanko);color:#fff}
.choice.mid small{color:#ffffffa0}
.kbd{display:inline-block;padding:0 5px;border-radius:5px;border:1px solid currentColor;font-size:10px;line-height:15px;opacity:.75}

/* pin-the-year */
.dial{margin-top:18px;border-radius:24px;padding:18px 16px;background:var(--panel);border:1px solid var(--line);text-align:center}
.dial .y{font-size:64px;font-weight:800;font-family:var(--num);letter-spacing:-2px;line-height:1}
.dial input{width:100%;accent-color:var(--hanko);margin:14px 0 4px}

/* reveal */
.reveal-top{display:flex;gap:16px;align-items:flex-end;margin-top:8px;perspective:600px}
.cover{width:132px;height:132px;border-radius:10px;flex:none;position:relative;overflow:hidden;box-shadow:0 14px 34px #000c,0 0 0 1px #ffffff14;
  display:flex;flex-direction:column;justify-content:space-between;padding:10px;color:#fff;animation:flipin .55s cubic-bezier(.2,.9,.3,1.2) both}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.22),transparent 45%,rgba(0,0,0,.35))}
.cover .ca{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;opacity:.9;position:relative;z-index:1}
.cover .cb{font-size:15px;font-weight:800;line-height:1.05;letter-spacing:-.2px;position:relative;z-index:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cover .disc{position:absolute;right:-26px;top:50%;width:84px;height:84px;margin-top:-42px;border-radius:50%;background:repeating-radial-gradient(circle,#0000 0 3px,rgba(0,0,0,.18) 3px 4px);opacity:.6}
@keyframes flipin{from{transform:rotateY(-90deg) scale(.9);opacity:0}to{transform:none;opacity:1}}
.song-t{font-size:21px;font-weight:750;letter-spacing:-.3px;line-height:1.15}
.song-a{color:var(--muted);font-size:15px;margin-top:3px}
.verdict{margin-top:18px;border-radius:22px;padding:18px;position:relative;overflow:hidden}
.verdict.ok{background:linear-gradient(160deg,#173a2d,#132a22);border:1px solid #23573f}
.verdict.bad{background:linear-gradient(160deg,#3d1e1a,#2a1714);border:1px solid #5a2a23}
.verdict .big{font-size:76px;font-weight:800;font-family:var(--num);letter-spacing:-3px;line-height:1}
.verdict .what{font-size:15px;font-weight:650}
.verdict .why{font-size:13.5px;color:#ffffffb0;margin-top:3px}
.stamp{position:absolute;right:16px;top:16px;width:78px;height:78px;border-radius:14px;border:3px solid currentColor;display:grid;place-items:center;
  transform:rotate(-12deg);font-weight:900;font-size:13px;letter-spacing:1px;text-align:center;line-height:1.05;opacity:.9}
.verdict.ok .stamp{color:var(--jade)} .verdict.bad .stamp{color:var(--rose)}
.stamp.anim{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-30deg) scale(2.2);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.9}}
.ruler{margin-top:16px;position:relative;height:58px}
.ruler .line{position:absolute;left:0;right:0;top:30px;height:2px;background:#ffffff25}
.ruler .tick{position:absolute;top:26px;width:1px;height:10px;background:#ffffff40}
.ruler .tick.big{height:14px;top:24px;background:#ffffff70}
.ruler .tl{position:absolute;top:42px;font-size:10.5px;color:#ffffff80;transform:translateX(-50%);font-family:var(--num)}
.ruler .mk{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;gap:2px}
.ruler .mk i{width:12px;height:12px;border-radius:50%;margin-top:9px;box-shadow:0 0 0 3px #0005}
.ruler .gap{position:absolute;top:30px;height:2px;background:var(--rose)}
.src{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:13px;line-height:1.4}
.src .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--panel2);display:grid;place-items:center;font-size:14px}
.src b{color:var(--paper)}
.src .m{color:var(--muted)}
.src a{color:var(--sky);text-decoration:none}
.srs{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}

/* summary */
.ring{width:150px;height:150px;position:relative;margin:4px auto 0}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:40px;font-family:var(--num);font-weight:800;letter-spacing:-1px}
.ring .c span{font-size:12px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats3 .card{padding:12px;text-align:center}
.stats3 b{font-size:22px;font-family:var(--num);display:block}
.stats3 span{font-size:11.5px;color:var(--muted)}
.dbar{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:8px}
.dbar .n{width:38px;font-family:var(--num);font-weight:700}
.dbar .b{flex:1;height:10px;border-radius:9px;background:var(--panel2);overflow:hidden}
.dbar .b i{display:block;height:100%;border-radius:9px}
.dbar .v{width:42px;text-align:right;color:var(--muted);font-family:var(--num)}
.miss{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #2a2520}
.miss:last-child{border:0}
.miss .art{width:42px;height:42px;border-radius:10px;font-size:12px}
.miss .y{margin-left:auto;text-align:right;font-family:var(--num)}
.miss .y b{font-size:17px}
.miss .y div{font-size:11.5px;color:var(--muted)}
.beltprog{display:flex;align-items:center;gap:12px}
.beltprog .b{flex:1;height:8px;border-radius:9px;background:var(--panel2);overflow:hidden}
.beltprog .b i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#f3d27a)}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #2a2520;font-size:14.5px}
.set-row:last-child{border:0}
.set-row .m{font-size:12.5px;color:var(--muted);margin-top:2px}
.ok-dot{width:9px;height:9px;border-radius:50%;background:var(--jade);box-shadow:0 0 0 4px #3dbb8c25;display:inline-block}
.warn-dot{background:var(--gold);box-shadow:0 0 0 4px #e9b44c25}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--panel2);position:relative;flex:none;border:1px solid var(--line)}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.2s}
.toggle.on{background:var(--jade);border-color:var(--jade)} .toggle.on::after{left:21px;background:#fff}
.field{display:flex;gap:8px;margin-top:10px}
.field input{flex:1;height:44px;border-radius:12px;background:var(--ink2);border:1px solid var(--line);color:var(--paper);padding:0 12px;font-family:ui-monospace,monospace;font-size:13px}
.steps{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.6}
.steps b{color:var(--paper);font-weight:600}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #2a2520}
.radio:last-child{border:0}
.radio .o{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px}
.radio.on .o{border:6px solid var(--hanko)}
.radio .t{font-size:14.5px;font-weight:600}
.radio .s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}

@keyframes drain{from{stroke-dashoffset:0}to{stroke-dashoffset:var(--c)}}
@keyframes drainw{from{width:100%}to{width:0}}
.tbar{height:8px;border-radius:9px;background:var(--panel2);overflow:hidden;margin:10px 6px 0}
.tbar i{display:block;height:100%;background:var(--gold);border-radius:9px}
.padbtn{flex:1;min-height:86px;max-height:130px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:26px;font-weight:800;color:#13110f;box-shadow:0 8px 24px #0008;transition:transform .08s}
.padbtn:active{transform:scale(.97)}
.padbtn svg{width:30px;height:30px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear infinite;opacity:.9}
@keyframes fall{to{transform:translateY(900px) rotate(540deg)}}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;padding:9px 14px;border-radius:12px;box-shadow:0 10px 30px #000a;white-space:nowrap;z-index:30}
.fade-in{animation:fi .28s ease both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- tablet layout (last, so it wins over the phone rules above) ----------
   The .app is the container: from 760px two columns. */
.app{container-type:inline-size;container-name:app}
.cols{display:block}
@container app (min-width:560px){
  .scroll{padding-left:max(18px,calc((100% - 560px)/2));padding-right:max(18px,calc((100% - 560px)/2))}
}
@container app (min-width:760px){
  .scroll{padding:10px 40px 24px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 36px;align-items:start}
  .cols.mid{align-items:center}
  .cols > .col > .label:first-child{margin-top:8px}
  .vinyl{width:280px;height:280px}
  .yearcard .y{font-size:118px;letter-spacing:-4px}
  .choice{height:92px;font-size:17px}
  .wave{height:44px}
  .reveal-top .cover{width:180px;height:180px}
  .song-t{font-size:26px}
  .verdict .big{font-size:96px}
  .sticky-cta{display:flex;justify-content:flex-end;padding:12px 40px 20px}
  .sticky-cta > .btn{max-width:420px}
  .sticky-cta[style*="grid"]{display:grid !important;grid-template-columns:200px 280px !important;justify-content:end}
  .tabs{justify-content:center;gap:40px}
  .decades{grid-template-columns:repeat(4,1fr)}
  .scroll.playscr{display:flex;flex-direction:column}
  .scroll.playscr > .cols.mid{flex:1;min-height:0;align-content:center}
}
/* iPad portrait (760–999): list screens keep two columns, play + reveal stack centered */
@container app (min-width:760px) and (max-width:999px){
  .cols.wide{display:flex;flex-direction:column;justify-content:center}
  .cols.wide > .col{width:100%;max-width:580px;margin:0 auto}
  .cols.wide .yearcard{margin-top:28px}
}

// Song memory across sessions (mock seed): mastered songs get harder cards, learning ones easier.
const MEM = {"Wonderwall":"mastered","Hey Ya!":"mastered","Dancing Queen":"learning","Superstition":"learning"};

function pickTier(card,ses){
  const base=[...DIFF[S.cfg.diff].mix];
  let shift=0;                                       // + harder, - easier
  if(ses.i<2) shift--;                               // warm-up: first two cards lean easy
  if(ses.streak>=3) shift++;                         // on a roll: tighten
  if(ses.lastMiss) shift--;                          // just missed: give an easier one
  const mem=MEM[card.song.t];
  if(mem==="learning") shift--; else if(mem==="mastered") shift++;
  if(card.retry) shift+=2;                           // missed earlier this session and just saw the year: test recall
  shift=Math.max(-2,Math.min(2,shift));
  // each step moves weight between the ends: harder = easy → tight/exact, easier = tight/exact → easy/clear
  const w=base;
  for(let s=0;s<Math.abs(shift);s++){
    if(shift>0){ const a=Math.min(.15,w[0]); w[0]-=a; w[2]+=a*.65; w[3]+=a*.35; }
    else { const a=Math.min(.12,w[2]), b=Math.min(.04,w[3]); w[2]-=a; w[3]-=b; w[0]+=a*.6+b; w[1]+=a*.4; }
  }
  const sum=w.reduce((a,b)=>a+b,0); let r=Math.random()*sum;
  for(let i=0;i<4;i++){ if((r-=w[i])<0) return i; } return 1;
}
function proposeYear(card,ses){
  const y=card.song.y, tier=pickTier(card,ses), [lo,hi]=TIERS[tier].r;
  card.tier=tier;
  if(hi===0) return y;
  const d=rnd(lo,hi);
  // direction: 50/50 when both fit; near the edges (2023 songs, 1920s songs) only the side that fits
  const canUp=y+d<=YEAR_MAX, canDown=y-d>=YEAR_MIN;
  const up = canUp&&canDown ? Math.random()<.5 : canUp;
  return up? y+d : y-d;
}
function ensureProposal(){ const ses=S.ses; if(!ses) return; const c=ses.queue[ses.i]; if(c && c.proposed==null) c.proposed=proposeYear(c,ses); }
function startSession(){
  const pool=[...SONGS].sort(()=>Math.random()-.5).slice(0,S.cfg.len);
  S.ses={queue:pool.map(s=>({song:s,proposed:null,retry:false})),i:0,results:[],learning:new Set(),mastered:0,t0:Date.now(),
    clip:{pos:0,playing:true,len:S.cfg.clipLen,extra:0},answer:null,dial:null,streak:0,best:0,lastMiss:false};
  go("play");
}
function answer(choice){
  const ses=S.ses; if(!ses||ses.answer) return;
  const c=ses.queue[ses.i], y=c.song.y, p=c.proposed;
  let ok;
  if(S.cfg.mode==="pin"){ ok=Math.abs(choice-y)<=1; ses.answer={choice,ok,diff:Math.abs(choice-y)}; }
  else{
    ok = choice==="exact"? p===y : choice==="earlier"? y<p : y>p;
    ses.answer={choice,ok,diff:Math.abs(p-y)};
  }
  ses.streak = ok? ses.streak+1 : 0; ses.best=Math.max(ses.best,ses.streak); ses.lastMiss=!ok;
  ses.results.push({song:c.song,proposed:p,choice,ok,retry:c.retry});
  const key=c.song.t;
  if(ok){ if(ses.learning.has(key)){ses.learning.delete(key);} ses.mastered++; }
  else if(!c.retry){ ses.learning.add(key); // quizlet-style: comes back 3 cards later with a new proposed year
    const at=Math.min(ses.i+4,ses.queue.length); ses.queue.splice(at,0,{song:c.song,proposed:null,retry:true}); }
  ses.clip.playing=false;
  go("reveal");
}
function next(){
  const ses=S.ses; ses.i++; ses.answer=null; ses.dial=null; ses.clip={pos:0,playing:true,len:S.cfg.clipLen,extra:0};
  go(ses.i>=ses.queue.length?"summary":"play");
}
function go(screen){ const prev=S.screen; S.screen=screen; if(screen==="play") ensureProposal(); if(S.view==="proto") audioOnScreen(prev,screen); render(); }

function waveBars(progress){
  let h=""; for(let i=0;i<40;i++){const v=.25+.75*Math.abs(Math.sin(i*1.7)*Math.cos(i*.45)); h+=`<i class="${i/40<progress?"on":""}" style="height:${Math.round(v*100)}%"></i>`;} return h;
}
function progBar(ses){
  return `<div class="prog">${ses.queue.map((q,i)=>{const r=i<ses.i?ses.results[i]:null;return `<i class="${r?(r.ok?"ok":"bad"):i===ses.i?"cur":""}"></i>`}).join("")}</div>`;
}
function counts(ses){
  return `<div class="counts"><span><b class="num">${ses.i+ (ses.answer?1:0)}</b> / ${ses.queue.length}</span><span><i class="dot" style="background:var(--jade)"></i><b class="num">${ses.mastered}</b> right &nbsp; <i class="dot" style="background:var(--gold)"></i><b class="num">${ses.learning.size}</b> learning</span><span>${ICON.flame} <b class="num">${ses.streak}</b></span></div>`;
}

function ruler(proposed,actual,mode){
  const lo=Math.min(proposed,actual)-4, hi=Math.max(proposed,actual)+4, span=hi-lo, x=y=>((y-lo)/span*100).toFixed(2)+"%";
  let t=""; for(let y=lo;y<=hi;y++){const big=y%5===0; t+=`<div class="tick ${big?"big":""}" style="left:${x(y)}"></div>${big?`<div class="tl" style="left:${x(y)}">${y}</div>`:""}`;}
  const same=proposed===actual;
  // the earlier year's label grows left from its dot, the later one's right, so close years never collide
  const side=later=>later?"transform:translateX(-6px);align-items:flex-start":"transform:translateX(calc(-100% + 6px));align-items:flex-end";
  return `<div class="ruler"><div class="line"></div>${t}
   ${same?"":`<div class="gap" style="left:${x(Math.min(proposed,actual))};width:calc(${x(Math.max(proposed,actual))} - ${x(Math.min(proposed,actual))})"></div>`}
   ${same?"":`<div class="mk" style="left:${x(proposed)};color:#ffffffb0;${side(proposed>actual)}">${mode==="pin"?"you":"shown"} ${proposed}<i style="background:#bbb"></i></div>`}
   <div class="mk" style="left:${x(actual)};color:var(--paper);${same?"":side(actual>proposed)}">actual ${actual}<i style="background:var(--paper)"></i></div></div>`;
}
function scrReveal(){

    : (a.choice==="exact"?`Not ${p} — it's ${dir}`:dir==="exact"?`It was exactly ${p}!`:`It's ${dir}, not ${a.choice}`);
  const xp = a.ok ? (pin&&a.diff===0||dir==="exact"?30:a.diff<=2?20:10) * (ses.clip.extra?.5:1) : 0;
  const stamp = a.ok ? (dir==="exact"||pin&&a.diff===0?"BULLS<br>EYE":"HIT") : "MISS";
  return `${statusBar()}<div class="scroll fade-in">

   <div class="verdict ${a.ok?"ok":"bad"}">
     <div class="stamp anim">${stamp}</div>

     <div class="what" style="margin-top:6px">${what}</div>
     ${!pin&&c.tier!=null?`<div style="margin-top:6px"><span class="pill" style="font-size:11px;padding:3px 8px;border-color:${TIERS[c.tier].col}">${TIERS[c.tier].label}${c.tier<3?` · ${a.diff} yr${a.diff>1?"s":""} off`:""}</span></div>`:""}
     <div class="why">${a.ok?`+${xp} XP${ses.clip.extra?" (½ for extra clip)":""}${ses.streak>1?` · streak ${ses.streak}`:""}`:c.retry?"Still learning — it comes back next session.":"Back in a few cards with a different year."}</div>

     <div style="margin-top:4px"><a href="#" data-act="flag">Wrong year? Flag it</a></div></div></div>
   <div class="actions">
     <button class="btn ghost small" style="width:100%" data-act="listen">${ICON.play} Keep listening</button>

  const tItems=[], shotT=(cap,desc,fn,portrait)=>tItems.push(`<figure><div class="tablet ${portrait?"portrait":""}" style="zoom:${portrait?.42:.5}"><div class="app">${fn()}</div></div><figcaption><b>${cap}</b>${desc}</figcaption></figure>`);
  S.cfg={...save.cfg,mode:"ab"};
  shotT("iPad · Home","Hero and progress left, decades and decks right.",scrHome);
  S.ses=demoSession(7,null); shotT("iPad · Listen & guess","Stage left (record, clip), year card and big answer buttons right — the split party mode reuses.",scrPlay);
  S.ses=demoSession(7,{choice:"later",ok:true,diff:4}); S.ses.queue[7].tier=1; shotT("iPad · Reveal","Cover, year and ruler left; year source and actions right.",scrReveal);
  S.ses=demoSession(9,null); S.ses.i=9; shotT("iPad · Summary","Score left, decades and misses right.",scrSummary);
  S.cfg={...save.cfg,src:"hit",sets:["Essentials","Mega Mix"]}; shotT("iPad · New session","What to listen to left, how to play right.",scrSetup);
  shotT("iPad · Host lobby","QR + room code left, players and game settings right. The iPad / TV is the stage.",scrHost);
  shotT("Stage · Get ready","3 s of 3, 2, 1 before every round, the first one too; the clip starts at 0 on the server's clock.",scrStageCountdown);
  shotT("Stage · Round live","Clip plays here; the year, a 15 s countdown, all players — locked-out ones greyed with ✕.",scrStage);
  shotT("Stage · Round result","Song, cover, real year and ruler left; who took the round, in how many seconds, and the standings right.",scrStageResult);
  shotT("Stage · Game over","First to 10: podium, confetti, rematch.",scrStageOver);
  S.cfg={...save.cfg,mode:"ab"}; S.ses=demoSession(7,null); shotT("iPad portrait · Listen & guess","820 px wide: still two columns.",scrPlay,true);
  Object.assign(S,save);
  const gallery=`<div class="board" style="display:block;border-top:1px solid #221e1a"><h2 style="font-size:16px;margin:0 0 18px">Avatar set · 12 comic music objects (own SVG)</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 14px">${AV_KEYS.map(k=>`<div style="text-align:center">${av(k,128)}<div style="margin-top:8px;font-weight:650">${AVATARS[k].name}</div></div>`).join("")}</div></div>`;
  return `<div class="board">${items.join("")}</div><div class="board board-t">${tItems.join("")}</div>${gallery}`;
}
function renderNotes(){
  return `<div class="notes">
  <h2>Party mode (the main feature)</h2>
  <p>The stage (iPad, laptop on the TV) plays the clip and shows a year; everyone answers on their phone. First correct answer = 1 point, +1 if it's a correct "Spot on"; a wrong answer locks you out for the round (the stage shows the ✕, never the answer); 15 s per round; first to 10 wins; max 8 players. Join by QR or 4-letter code, no account. Screens: Party tab → Host a game → Start game (stage, iPad frame) and Join (pad, iPhone frame).</p>
  <h2>Training (side feature)</h2>
  <p>Clip plays (Apple Music 90 s preview) → a year is shown → <b>Earlier</b> / <b>Spot on</b> / <b>Later</b> → reveal with stamp, real year and a ruler → next. Missed songs re-enter the queue ~3 cards later with a <i>different</i> proposed year, so you learn the year itself, not the button (Quizlet "learn" style). Across sessions: spaced repetition per song (new → learning → mastered), decade accuracy, XP, record awards (bronze → diamond), daily streak.</p>
  <h2>Proposed year (training mode)</h2>
  <p>The shown year scatters around the real one: mostly clearly off, sometimes close, rarely exact. Four tiers: easy ±10–25 (other era), clear ±4–9, tight ±1–3, exact. Base mix (easy/clear/tight/exact): Easy 55/25/8/12 · Medium 35/30/20/15 · Hard 12/28/38/22. Per card it shifts: first two cards and the card after a miss lean easy; a streak of 3+ and mastered songs lean tight; a "learning" song leans easy; the re-ask of a song missed this session leans tight/exact (the year was just shown, so it tests recall). Measured on Medium, 4000 draws: 36% ±10+, 29% ±4–9, 20% ±1–3, 15% exact; after a miss 47/35/8/11; on a streak 22/28/29/21. Direction is 50/50 unless one side runs past 1900 or the current year. The reveal labels the card (Easy one / Tight one · 2 yrs off).</p>
  <p>Party mode (the main feature) uses no adaptation: every player sees the same year, so it must be fair, not personal.</p>
  <h2>Audio</h2>
  <p>Spike-verified: catalog songs carry <code>previews[].url</code>, a <b>90 s</b> AAC m4a (".plus.aac.ep"), with the developer token only. Served from audio-ssl.itunes.apple.com with CORS <code>*</code> and range requests, so the browser plays it directly, no proxy. The 90 s are not the song's start: checked by ear on Dancing Queen, the preview starts ~10 s before the chorus (Apple picks the hook). The intro can't be played without full-track playback. "Before the chorus" plays the preview from 0, "Random spot" seeks inside the 90 s. Every clip fades in (~1.5 s) and fades out at its end, on an answer and on skip; matters most for "Random spot", which lands mid-word. Done with Web Audio (GainNode ramp): iOS Safari ignores <code>audio.volume</code>, and Apple's CORS <code>*</code> lets Web Audio read the stream. The mock plays the real previews (mocks/previews.js, 30 of the 31 sample songs) with these fades; songs without a preview fall back to a simulated clip.</p>
  <h2>Song sources</h2>
  <p><b>Card sets</b>: community card lists of the German editions (artist, title, card year), ~3,000 cards, under our own names: Essentials 308 (1908–2021), Mega Mix 500, Rock Anthems, Schlager Fest, Sunshine, Cheesy Classics, Party Starters, Crowd Pleasers 226, Screen Hits 154, Christmas Hits 154, Radio Gold 154. Matched once to Apple Music for the preview, scored with the card year.</p>
  <p><b>Categories</b> (Smash Hits, Number ones, Summer, Party, Guilty pleasures, Movie &amp; TV, Christmas, One-hit wonders, Eurovision, Swiss charts, Evergreens) and <b>Genres</b> (General = widest span, Pop, Rock, Schlager &amp; Deutschpop, …): built on one well-known pool, dev token only.</p>
  <p><b>Well-known pool.</b> 1950s–2020s: for each decade, collect the Apple Music "best of the 1950s … 2020s" playlists (editorial + top catalog search hits); a song is in when it's on at least half of its decade's lists. Before 1950: no "best of the 1940s" lists, since nobody alive heard those as hits. Only <b>evergreens</b> count: songs still played today, i.e. on today's Christmas, film-classics and standards playlists, plus the pre-1950 card-set songs (all 16 in the German editions are that kind: White Christmas, Over the Rainbow, As Time Goes By, In the Mood, Guantanamera, La donna è mobile …). Categories and genres then filter that pool. <b>Library</b>: your playlists via media-user-token. Year-range filter on top of everything.</p>
  <h2>Spike facts (2026-11-03)</h2>
  <p>
  · Dev token: web player bundle JWT (iss AMPWebPlay), same as tunewire; API calls need <code>Origin: https://music.apple.com</code>.<br>
  · <code>songs?filter[isrc]=</code> works but pages at 25: Dancing Queen has 25+ versions and <i>Arrival</i> wasn't on page 1. Original version = MusicBrainz release-group title + date → Apple album search → track with the same ISRC (Arrival 1976-10-11 and A Night At The Opera 1975-11-21 both exist with previews).<br>
  · Apple song-level <code>releaseDate</code> is the original on major-label tracks even on compilations (Dancing Queen 1976-01-01, Bohemian Rhapsody 1975-10-31); the album date is the compilation's. Wrong for old/indie material (Guantanamera 1960). Cross-check only, never the source.<br>
  · MusicBrainz: one ISRC can map to several recordings (Dancing Queen: 1976-08-15 and a bogus 2023-12-01) → take the minimum first-release-date. 1 req/s; generic User-Agent gets 503 "busy" → real app name + contact in the UA.<br>
  · Guantanamera: earliest MusicBrainz recording 1940, Apple 1960, card 1929. Card decks use the card year; elsewhere "initial" = earliest MusicBrainz date.<br>
  · Cover Art Archive <code>release-group/{id}/front-500</code> → 307 to archive.org, real original scan (Arrival verified).<br>
  · Apple API bodies sometimes arrived truncated (IncompleteRead), maybe the sandbox proxy; the import retries regardless.
  </p>
  <h2>Cover art</h2>
  <p>Always the original cover, never a compilation or remaster sleeve. Source, in order: Apple's artwork when the matched Apple version is the original album, else the Cover Art Archive image of the first release (MusicBrainz, fetched by the offline import), else a neutral record placeholder.</p>
  <h2>Year accuracy (the open risk)</h2>
  <p>Rule: always the initial release year, never a re-release date. Apple's <code>releaseDate</code> is the version's date (Bohemian Rhapsody → 2011 remaster, Dancing Queen → 1992 ABBA Gold), so it never counts on its own. Card sets: card year. Everything else: earliest release across sources. A song with no trustworthy initial year stays out of the deck. "Flag wrong year" catches what slips through.</p>
  </div>`;
}

/* ======================= render + events ======================= */
let timer=null;
function render(){
  document.querySelectorAll("#viewSeg button").forEach(b=>b.classList.toggle("on",b.dataset.view===S.view));
  document.querySelectorAll("#frameSeg button").forEach(b=>b.classList.toggle("on",b.dataset.frame===S.frame));
  $("#frameSeg").style.visibility=S.view==="proto"?"visible":"hidden";
  if(S.view==="board"){ $("#root").innerHTML=renderBoard(); return; }
  if(S.view==="notes"){ $("#root").innerHTML=renderNotes(); return; }
  const scr=(SCREENS[S.screen]||scrHome)();
  const cls={phone:"phone",ipad:"tablet",ipadp:"tablet portrait",full:"full"}[S.frame];
  $("#root").innerHTML=`<div class="stage"><div class="${cls}" style="${fitZoom()}"><div class="app" id="app">${scr}</div></div></div>`;
  bindDynamic();
}
/* ---------- audio: real Apple previews (previews.js) through Web Audio, with fades ----------
   Volume goes through a GainNode, not audio.volume: iOS Safari ignores audio.volume.
   Apple serves previews with CORS *, so a crossOrigin element can feed Web Audio. */
const FADE_IN=1.5, FADE_OUT=0.8, PREVIEW_LEN=90;
const AUD={ctx:null,gain:null,el:null,node:null,url:null,live:false,fading:false,stopT:null};
function audioUrl(song){ return typeof PREVIEWS!=="undefined" && PREVIEWS[song.t]?.p || null; }
function level(){ return AUD.gain? AUD.gain.gain.value : (S.ses?.clip.playing?1:0); }
function ensureCtx(){
  if(!AUD.ctx){ AUD.ctx=new (window.AudioContext||window.webkitAudioContext)(); AUD.gain=AUD.ctx.createGain(); AUD.gain.gain.value=0; AUD.gain.connect(AUD.ctx.destination); }
  if(AUD.ctx.state==="suspended") AUD.ctx.resume();
}
function load(url){
  if(AUD.url===url) return;
  if(AUD.el){ AUD.el.pause(); AUD.node?.disconnect(); }
  const el=new Audio(); el.crossOrigin="anonymous"; el.preload="auto"; el.src=url;
  AUD.el=el; AUD.url=url; AUD.node=AUD.ctx.createMediaElementSource(el); AUD.node.connect(AUD.gain);
}
function fadeIn(from){ // start (or resume) playback at `from` seconds with a gain ramp 0 → 1
  clearTimeout(AUD.stopT); AUD.fading=false;
  const g=AUD.gain.gain, now=AUD.ctx.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(0.0001,now); g.linearRampToValueAtTime(1,now+FADE_IN);
  if(from!=null) AUD.el.currentTime=from;
  AUD.el.play().catch(()=>{});
}
function fadeOut(d=FADE_OUT){ // ramp current gain → 0, then pause
  if(!AUD.el||AUD.el.paused||AUD.fading) return;
  AUD.fading=true;
  const g=AUD.gain.gain, now=AUD.ctx.currentTime;
  g.cancelScheduledValues(now); g.setValueAtTime(g.value,now); g.linearRampToValueAtTime(0.0001,now+d);
  clearTimeout(AUD.stopT); AUD.stopT=setTimeout(()=>{ AUD.el.pause(); AUD.fading=false; },d*1000+30);
}
function startCardAudio(){ // called when a card enters the play screen
  const ses=S.ses, song=ses.queue[ses.i].song, url=audioUrl(song), total=ses.clip.len+ses.clip.extra;
  ses.clip.from = S.cfg.clipStart==="random" ? Math.floor(Math.random()*Math.max(1,PREVIEW_LEN-total-1)) : 0;
  ses.clip.pos=0; ses.clip.playing=true;
  AUD.live=!!url;
  if(!url){ if(AUD.el) fadeOut(.3); return; } // no preview → simulated clip
  ensureCtx(); load(url); fadeIn(ses.clip.from);
}
function audioOnScreen(prev,screen){
  if(screen==="play" && S.ses) startCardAudio();
  else if(prev==="play"||prev==="reveal"||prev==="summary") fadeOut(screen==="reveal"?.6:.4);
}
function fitZoom(){ // scale the iPad frame down to the window, never up
  if(S.frame!=="ipad"&&S.frame!=="ipadp") return "";
  const [w,h]=S.frame==="ipad"?[1180,820]:[820,1180];
  const z=Math.min(1,(innerWidth-40)/w,(innerHeight-110)/h);
  return `zoom:${z.toFixed(3)}`;
}
addEventListener("resize",()=>{ if(S.view==="proto"&&S.frame.startsWith("ipad")) render(); });
function rerenderPlay(){ // light refresh for the clip ticker without killing drag state
  if(S.view!=="proto"||S.screen!=="play"||dragging) return;
  const ses=S.ses, total=ses.clip.len+ses.clip.extra, p=Math.min(ses.clip.pos/total,1);
  const w=document.querySelector(".wave"); if(!w) return;
  w.innerHTML=waveBars(p); w.style.opacity=(0.25+0.75*Math.min(1,level())).toFixed(2); // the fade, visible
  const t=document.querySelector(".time span"); if(t) t.textContent=`0:${String(Math.floor(ses.clip.pos)).padStart(2,"0")}`;
  const v=document.querySelector("#vol"); if(v) v.style.width=Math.round(Math.min(1,level())*100)+"%";
}
setInterval(()=>{ const ses=S.ses; if(!ses||S.screen!=="play"||!ses.clip.playing) return;
  const total=ses.clip.len+ses.clip.extra;
  if(AUD.live&&AUD.el){ ses.clip.pos=Math.max(0,Math.min(AUD.el.currentTime-ses.clip.from,total));
    if(ses.clip.pos>=total-FADE_OUT) fadeOut(); }       // fade out into the clip's end
  else ses.clip.pos=Math.min(ses.clip.pos+.1,total);
  if(ses.clip.pos>=total-.05){ ses.clip.playing=false; render(); } else rerenderPlay(); },100);
setInterval(()=>{ document.querySelectorAll(".cd").forEach(el=>{ const v=Math.max(0,(+el.textContent)-1); el.textContent=v; }); },1000);
function togglePlay(){
  const ses=S.ses, total=ses.clip.len+ses.clip.extra;
  if(ses.clip.pos>=total-.05){ replay(); return; }
  ses.clip.playing=!ses.clip.playing;
  if(AUD.live){ if(ses.clip.playing){ ensureCtx(); fadeIn(null); } else fadeOut(.3); }
}
function replay(){ const ses=S.ses; ses.clip.pos=0; ses.clip.playing=true; if(AUD.live){ ensureCtx(); fadeIn(ses.clip.from); } }

function toast(msg){ S.toast=msg; render(); clearTimeout(timer); timer=setTimeout(()=>{S.toast=null;render();},1600); }

document.addEventListener("click",e=>{
  const v=e.target.closest("[data-view]"); if(v){ if(v.dataset.view!=="proto"){ fadeOut(.3); if(S.ses) S.ses.clip.playing=false; }
    S.view=v.dataset.view;render();window.scrollTo(0,0);return;}
  const f=e.target.closest("[data-frame]"); if(f){S.frame=f.dataset.frame;render();return;}
  if(S.view!=="proto") return;
  const el=e.target.closest("[data-go],[data-act],[data-ans],[data-src],[data-pick],[data-set],[data-genre],[data-mode],[data-diff],[data-clip],[data-clen],[data-len],[data-range],[data-av],[data-who],[data-joinav]");
  if(!el) return; e.preventDefault();
  const d=el.dataset, c=S.cfg;
  if(d.go){ if((d.go==="summary")&&!S.ses){go("home");return;} go(d.go); return; }
  if(d.ans){ flashCard(d.ans); return; }
  if(d.src){ c.src=d.src; if(d.src==="lib")c.pick="Road Trip 2024"; if(d.src==="cat")c.pick="Smash Hits"; }
  if(d.set){ c.sets=c.sets.includes(d.set)?(c.sets.length>1?c.sets.filter(s=>s!==d.set):c.sets):[...c.sets,d.set]; }
  if(d.genre){ if(d.genre==="General") c.genres=["General"]; else { const g=c.genres.filter(x=>x!=="General"); c.genres=g.includes(d.genre)?g.filter(x=>x!==d.genre):[...g,d.genre]; if(!c.genres.length)c.genres=["General"]; } }
  if(d.pick) c.pick=d.pick;
  if(d.av){ S.me.av=d.av; PLAYERS[0][2]=d.av; }
  if(d.joinav) S.joinAv=d.joinav;
  if(d.who){ const p=PLAYERS.find(x=>x[0]===d.who); S.me={name:p[0],av:p[2]}; go("home"); return; }
  if(d.mode){ if(d.mode==="line"){toast("Timeline mode: later");return;} c.mode=d.mode; }
  if(d.diff) c.diff=d.diff;
  if(d.clip) c.clipStart=d.clip;
  if(d.clen) c.clipLen=+d.clen;
  if(d.len) c.len=+d.len;
  if(d.range){ const [a,b]=d.range.split("-").map(Number); c.from=a; c.to=b; }
  if(d.act){
    const ses=S.ses;
    switch(d.act){
      case "start": startSession(); return;
      case "next": next(); return;
      case "toggle": togglePlay(); break;
      case "replay": replay(); break;
      case "more": if(ses.clip.extra<10){ const ended=!ses.clip.playing||AUD.fading; ses.clip.extra+=10; ses.clip.playing=true; if(AUD.live&&ended){ ensureCtx(); fadeIn(null); } } break;
      case "pin": answer(+($("#dialIn")?.value||1990)); return;
      case "flag": toast("Thanks — year flagged for review"); return;
      case "partystart": resetRound(); if(S.frame==="phone") S.frame="ipad"; go("stage"); return;
      case "partyjoin": resetRound(); S.frame="phone"; go("padLive"); return;
      case "stagewin": go("stageResult"); return;
      case "stagenext": resetRound(); PARTY.round++; go("stage"); return;
      case "stageover": go("stageOver"); return;
      case "rematch": resetRound(); PARTY.round=1; go("stage"); return;
      case "pause": toast("Paused — clip and timer stop for everyone"); return;
      case "padwrong": go("padOut"); return;
      case "padwin": go("padWon"); return;
      case "padresult": go("padLost"); return;
      case "padagain": resetRound(); go("padLive"); return;
      case "pairdev": S.pair="device"; if(S.screen!=="me") go("me"); break;
      case "invite": S.pair="invite"; if(S.screen!=="me"){ go("me"); return; } break;
      case "pairclose": S.pair=null; break;
      case "listen": if(AUD.live&&AUD.el){ ensureCtx(); fadeIn(null); toast("Playing on — rest of the 90 s preview"); } else toast("No preview for this song in the mock"); return;
      case "am": toast("Opens the song in Apple Music"); return;
    }
  }
  render();
});
function flashCard(choice){
  const yc=$("#yc");
  if(yc){ const dx=choice==="earlier"?-420:choice==="later"?420:0, dy=choice==="exact"?-260:0;
    yc.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/30}deg)`; yc.style.opacity=".0"; yc.style.transition="transform .22s ease-in,opacity .22s";
    setTimeout(()=>answer(choice),180); }
  else answer(choice);
}

/* swipe on the year card */
let dragging=false;
function bindDynamic(){
  const dial=$("#dialIn"); if(dial) dial.oninput=()=>{ S.ses.dial=+dial.value; $("#dialY").textContent=dial.value; };
  const yc=$("#yc"); if(!yc) return;
  const tint=$("#tint"); let sx=0,sy=0;
  yc.onpointerdown=e=>{dragging=true;sx=e.clientX;sy=e.clientY;yc.classList.add("drag");yc.setPointerCapture(e.pointerId);};
  yc.onpointermove=e=>{ if(!dragging) return; const dx=e.clientX-sx, dy=Math.min(0,e.clientY-sy);
    yc.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/22}deg)`;
    const up=-dy>Math.abs(dx), mag=Math.min(1,Math.max(Math.abs(dx),-dy)/110);
    tint.style.opacity=mag; yc.querySelector(".q").style.opacity=1-mag; tint.style.background=up?"rgba(229,72,47,.85)":dx<0?"rgba(105,174,232,.85)":"rgba(233,180,76,.9)";
    tint.innerHTML=`<span>${up?"↑ SPOT ON":dx<0?"← EARLIER":"LATER →"}</span>`; };
  yc.onpointerup=e=>{ if(!dragging) return; dragging=false; yc.classList.remove("drag");
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(dx<-90) flashCard("earlier"); else if(dx>90) flashCard("later"); else if(dy<-90) flashCard("exact");
    else { yc.style.transform=""; tint.style.opacity=0; yc.querySelector(".q").style.opacity=1; } };
}
document.addEventListener("keydown",e=>{
  if(S.view!=="proto"||e.target.tagName==="INPUT"&&e.target.type!=="range") return;
  if(S.screen==="play"){
    if(S.cfg.mode==="pin"){ if(e.key==="Enter"){answer(+$("#dialIn").value);} return; }
    if(e.key==="ArrowLeft"){e.preventDefault();flashCard("earlier");}
    else if(e.key==="ArrowRight"){e.preventDefault();flashCard("later");}
    else if(e.key===" "||e.key==="ArrowUp"){e.preventDefault();flashCard("exact");}
    else if(e.key==="r"){replay();render();}
    else if(e.key==="p"){togglePlay();render();}
  } else if(S.screen==="reveal" && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); next(); }
  else if(S.screen==="home" && e.key==="Enter"){ startSession(); }
});
render();
